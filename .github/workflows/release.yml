name: Build & Release Police Helper

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - 'overlay.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle live page as offline fallback
        run: Copy-Item index.html app/index.html -Force

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Set build version (2.0.<run number>)
        working-directory: app
        run: npm version --no-git-tag-version "2.0.${{ github.run_number }}"

      # Build only — publishing is done in the next step with gh, because
      # electron-builder's own publisher uploads assets in parallel and can
      # race itself into creating duplicate releases for the same tag
      # (one holding the exe, one holding just the blockmap).
      - name: Build installer
        working-directory: app
        run: npx electron-builder --win --publish never

      - name: Create release with all artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" \
            app/dist/*.exe app/dist/*.blockmap app/dist/latest.yml \
            --target "${{ github.sha }}" \
            --title "2.0.${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}"
