name: Build & Release Police Helper

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - 'overlay.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle live page as offline fallback
        run: Copy-Item index.html app/index.html -Force

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Set build version (2.0.<run number>)
        working-directory: app
        run: npm version --no-git-tag-version "2.0.${{ github.run_number }}"

      # electron-builder refuses to create a published release on a
      # nonexistent tag (422: "Published releases must have a valid tag"),
      # so create and push the tag first. -f keeps re-runs idempotent.
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v2.0.${{ github.run_number }}"
          git push -f origin "v2.0.${{ github.run_number }}"

      - name: Build and publish to GitHub Releases
        working-directory: app
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
